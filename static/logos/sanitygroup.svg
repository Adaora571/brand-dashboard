<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 60">
  <defs>
    <clipPath id="dome">
      <circle cx="28" cy="32" r="23"/>
    </clipPath>
  </defs>

  <g transform="translate(2, 0)">
    <!-- DOME: 5 horizontal strips clipped to top-half of circle -->
    <!-- Circle top at y=9, equator at y=32. 5 strips × 3px + 4 gaps × 2px = 23px -->
    <g clip-path="url(#dome)">
      <rect x="0" y="9"  width="56" height="3" fill="#181A1B"/>
      <rect x="0" y="14" width="56" height="3" fill="#181A1B"/>
      <rect x="0" y="19" width="56" height="3" fill="#181A1B"/>
      <rect x="0" y="24" width="56" height="3" fill="#181A1B"/>
      <rect x="0" y="29" width="56" height="3" fill="#181A1B"/>
    </g>

    <!-- LEAVES: two curved petal shapes below dome -->
    <path d="M 28,32 C 17,32 3,39 3,46 C 3,51 14,57 28,58" fill="#181A1B"/>
    <path d="M 28,32 C 39,32 53,39 53,46 C 53,51 42,57 28,58" fill="#181A1B"/>
  </g>

  <!-- Text -->
  <text x="66" y="43" 
        font-family="'Futura', 'Nunito Sans', 'Inter', -apple-system, sans-serif" 
        font-weight="900" font-size="34" fill="#181A1B" 
        letter-spacing="-0.3">Sanity Group</text>
</svg>
