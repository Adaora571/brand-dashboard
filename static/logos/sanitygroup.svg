<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120">
  <defs>
    <style>
      .sanity-icon { fill: none; stroke: #181A1B; stroke-width: 2.5; }
      .sanity-fill { fill: #181A1B; }
      .sanity-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 800; font-size: 34px; fill: #181A1B; letter-spacing: -0.5px; }
    </style>
  </defs>

  <!-- Globe / circle emblem -->
  <circle cx="45" cy="62" r="32" class="sanity-icon" stroke-linecap="round"/>

  <!-- Horizontal lines inside circle (3 stripes) -->
  <line x1="17" y1="50" x2="73" y2="50" class="sanity-icon" stroke-linecap="round"/>
  <line x1="14" y1="62" x2="76" y2="62" class="sanity-icon" stroke-linecap="round"/>
  <line x1="17" y1="74" x2="73" y2="74" class="sanity-icon" stroke-linecap="round"/>

  <!-- Leaf / petal shape sitting on top of the circle -->
  <g class="sanity-fill">
    <path d="M 38 32 Q 45 8 52 32 Q 48 22 45 18 Q 42 22 38 32 Z"
          stroke="#181A1B" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Central vein of leaf -->
    <line x1="45" y1="18" x2="45" y2="32" stroke="#181A1B" stroke-width="1.2"/>
  </g>

  <!-- Text: Sanity Group (bold, NOT italic) -->
  <text x="95" y="73" class="sanity-text">Sanity Group</text>
</svg>
