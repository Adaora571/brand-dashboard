<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 40" fill="none">
  <!-- 8-pointed star icon (white for dark backgrounds) -->
  <g transform="translate(4, 2)">
    <line x1="18" y1="0" x2="18" y2="36" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="0" y1="18" x2="36" y2="18" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="5.3" y1="5.3" x2="30.7" y2="30.7" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="30.7" y1="5.3" x2="5.3" y2="30.7" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <!-- NORDLEAF text -->
  <text x="50" y="30" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" letter-spacing="3" fill="white">NORDLEAF</text>
</svg>