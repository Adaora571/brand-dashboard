<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — {{ manufacturer_name }} Dashboard</title>
<style>
  :root {
    --blue: #2563eb; --bg: #0f172a; --card: #1e293b;
    --border: #334155; --text: #f1f5f9; --muted: #94a3b8;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  .login-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 48px 40px; width: 100%; max-width: 420px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .logo {
    text-align: center; margin-bottom: 32px;
  }
  .logo h1 {
    font-size: 20px; font-weight: 700; color: var(--text);
    letter-spacing: -0.3px;
  }
  .logo p {
    font-size: 13px; color: var(--muted); margin-top: 6px;
  }
  .form-group {
    margin-bottom: 20px;
  }
  .form-group label {
    display: block; font-size: 12px; font-weight: 600;
    color: var(--muted); margin-bottom: 6px; text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .form-group input {
    width: 100%; padding: 12px 14px; font-size: 14px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); outline: none;
    font-family: inherit; transition: border-color 0.2s;
  }
  .form-group input:focus {
    border-color: var(--blue);
  }
  .form-group input::placeholder {
    color: #475569;
  }
  .btn-login {
    width: 100%; padding: 12px; font-size: 14px; font-weight: 600;
    background: var(--blue); color: #fff; border: none;
    border-radius: 8px; cursor: pointer; font-family: inherit;
    transition: background 0.2s; margin-top: 8px;
  }
  .btn-login:hover { background: #1d4ed8; }
  .btn-login:disabled {
    opacity: 0.5; cursor: not-allowed;
  }
  .error-msg {
    background: #451a1a; border: 1px solid #7f1d1d; color: #fca5a5;
    border-radius: 8px; padding: 10px 14px; font-size: 13px;
    margin-bottom: 20px; display: {% if error %}block{% else %}none{% endif %};
  }
  .security-note {
    text-align: center; margin-top: 24px; font-size: 11px; color: #475569;
  }
  .security-note svg {
    vertical-align: middle; margin-right: 4px;
  }
</style>
</head>
<body>
  <div class="login-card">
    <div class="logo">
      <h1>{{ manufacturer_name }}</h1>
      <p>Brand Performance Dashboard</p>
    </div>

    <div class="error-msg" id="errorMsg">{{ error or '' }}</div>

    <form method="POST" action="/brand/{{ slug }}/login" id="loginForm">
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" id="password"
               placeholder="Enter your dashboard password"
               autocomplete="current-password" required autofocus>
      </div>
      <button type="submit" class="btn-login" id="btnLogin">Sign In</button>
    </form>

    <div class="security-note">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="2">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      Secured connection — powered by HTV
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function() {
      document.getElementById('btnLogin').disabled = true;
      document.getElementById('btnLogin').textContent = 'Signing in…';
    });
  </script>
</body>
</html>
