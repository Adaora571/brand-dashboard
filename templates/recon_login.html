<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — HTV Sales Dashboard</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #1a0a2e; color: #f1f5f9; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .top-logo {
    text-align: center; margin-bottom: 80px;
  }
  .top-logo img { height: 38px; display: block; margin: 0 auto; }
  .login-card {
    background: #fff; border-radius: 16px; padding: 44px 40px; width: 100%; max-width: 420px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    color: #1e293b;
  }
  .card-header {
    text-align: center; margin-bottom: 28px;
  }
  .card-header h1 {
    font-size: 20px; font-weight: 700; color: #1a0a2e;
    letter-spacing: -0.3px;
  }
  .card-header p {
    font-size: 13px; color: #64748b; margin-top: 6px;
  }
  .form-group {
    margin-bottom: 20px;
  }
  .form-group label {
    display: block; font-size: 12px; font-weight: 600;
    color: #64748b; margin-bottom: 6px; text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .form-group input {
    width: 100%; padding: 12px 14px; font-size: 14px;
    background: #f8fafc; border: 1px solid #e2e8f0;
    border-radius: 8px; color: #1e293b; outline: none;
    font-family: inherit; transition: border-color 0.2s;
  }
  .form-group input:focus {
    border-color: #1a0a2e; box-shadow: 0 0 0 3px rgba(26,10,46,0.1);
  }
  .form-group input::placeholder {
    color: #94a3b8;
  }
  .btn-login {
    width: 100%; padding: 12px; font-size: 14px; font-weight: 600;
    background: #1a0a2e; color: #fff; border: none;
    border-radius: 8px; cursor: pointer; font-family: inherit;
    transition: background 0.2s; margin-top: 8px;
  }
  .btn-login:hover { background: #2d1650; }
  .btn-login:disabled {
    opacity: 0.5; cursor: not-allowed;
  }
  .error-msg {
    background: #fef2f2; border: 1px solid #fecaca; color: #dc2626;
    border-radius: 8px; padding: 10px 14px; font-size: 13px;
    margin-bottom: 20px; display: {% if error %}block{% else %}none{% endif %};
  }
  .security-note {
    text-align: center; margin-top: 24px; font-size: 11px; color: #94a3b8;
  }
  .security-note svg {
    vertical-align: middle; margin-right: 4px;
  }
</style>
</head>
<body>
  <div class="top-logo">
    <div style="font-size:26px;font-weight:800;color:#fff;letter-spacing:0.5px;">HTV Sales Dashboard</div>
  </div>

  <div class="login-card">
    <div class="card-header">
      <h1>HTV Sales Dashboard</h1>
      <p>Internal access only</p>
    </div>

    <div class="error-msg" id="errorMsg">{{ error or '' }}</div>

    <form method="POST" action="/reconciliation/login" id="loginForm">
      <div class="form-group">
        <label>Admin Password</label>
        <input type="password" name="password" id="password"
               placeholder="Enter admin password"
               autocomplete="current-password" required autofocus>
      </div>
      <button type="submit" class="btn-login" id="btnLogin">Sign In</button>
    </form>

    <div class="security-note">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      Secured connection — HTV internal
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function() {
      document.getElementById('btnLogin').disabled = true;
      document.getElementById('btnLogin').textContent = 'Signing in…';
    });
  </script>
</body>
</html>
